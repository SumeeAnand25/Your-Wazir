<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wazir | Technical & Functional Consultancy</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #111827;
            --surface-glass: rgba(17, 24, 39, 0.7);
            --border-color: rgba(212, 175, 55, 0.2);
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --teal: #14b8a6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Glassmorphism Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            fill: var(--gold);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--gold);
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--gold), #aa8c2c);
            color: #0b0f19;
            padding: 0.6rem 1.25rem;
            border-radius: 4px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-cta:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Hero Section */
        section {
            padding: 7rem 2rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero {
            text-align: center;
            align-items: center;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            color: var(--teal);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
        }

        .hero p {
            max-width: 700px;
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 2.5rem;
        }

        /* Contact Section & Form Styling */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            width: 100%;
            align-items: start;
        }

        .contact-info h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contact-info p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .form-card {
            background: var(--surface-glass);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 8px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--gold), #aa8c2c);
            color: #0b0f19;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                WAZIR
            </a>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#approach">Approach</a></li>
                <li><a href="#contact" class="active">Contact</a></li>
            </ul>
            <a href="#contact" class="nav-cta">Initiate Dialogue</a>
        </div>
    </header>

    <!-- Main Container / Contact Section -->
    <section id="contact">
        <div class="contact-grid">
            <div class="contact-info">
                <h2>Because Strategy Beats Force.</h2>
                <p>Connect with our technical and functional consultancy practice to architect high-performance solutions for your enterprise operations.</p>
            </div>
            
            <div class="form-card">
                <!-- Configured Contact Form routing directly to anandsumeet57@gmail.com -->
                <form action="https://formsubmit.co/anandsumeet57@gmail.com" method="POST">
                    
                    <!-- Hidden configurations for FormSubmit -->
                    <input type="hidden" name="_subject" value="New Inquiry via Wazir Consultancy Website">
                    <input type="hidden" name="_template" value="table">

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="john@enterprise.com">
                    </div>

                    <div class="form-group">
                        <label for="message">Project Scope / Message</label>
                        <textarea id="message" name="message" required placeholder="Describe your structural or technical requirements..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Send Transmission</button>
                </form>
            </div>
        </div>
    </section>

</body>
</html>
